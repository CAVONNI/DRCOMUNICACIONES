<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMR Comunicaciones - Inicio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cargando-auth">

    <header class="main-header"></header>

    <div class="window-container">
        <div class="admin-layout">
            <aside class="sidebar">
                <div class="login-logo">
                    <img src="LOGO/logo2.png" alt="DMR Comunicaciones" class="logo-empresa">
                </div>
                <ul class="sidebar-menu">
                    <li class="active"><a href="incio.html">Inicio</a></li>
                    <li><a href="listacliente.html">Clientes</a></li>
                    <li><a href="registrocliente.html">+ Nuevo Cliente</a></li>
                    <li><a href="pagocliente.html">Pagos</a></li>
                    <li><a href="reportes.html">Reportes</a></li>
                    
                </ul>
                <div class="sidebar-footer">Cerrar sesión</div>
            </aside>
            <main class="content-area">
                <div class="content-header">
                    <h1>Bienvenido, Diego Marin</h1>
                    <span style="font-size:14px; color:gray;">Resumen general de tus clientes y pagos.</span>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-info"><h3>Total Clientes</h3><p id="metricTotalClientes">-</p></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-info"><h3>Pagos del Mes</h3><p id="metricPagosMes">-</p></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-info"><h3>Pendientes</h3><p id="metricPendientes">-</p></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-info"><h3>Clientes Activos</h3><p id="metricActivos">-</p></div>
                    </div>
                </div>

                
                    <div class="panel-card">
                        <div class="panel-title">Últimos registros <a href="listacliente.html" style="font-size:12px; color:var(--accent);">Ver todos</a></div>
                        <table class="custom-table">
                            <thead>
                                <tr><th>Cliente</th><th>Servicio</th><th>Valor mes</th></tr>
                            </thead>
                            <tbody id="tablaRecientes">
                                <tr><td colspan="3">Cargando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="funciones.js"></script>
</body>
</html>
