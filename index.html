<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMR Comunicaciones - Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cargando-auth">

    <header class="main-header"></header>

    <div class="window-container">
        <div class="login-window">
            <div class="login-card">
                <div class="login-logo">
                    <img src="LOGO/logo.png" alt="DMR Comunicaciones" class="logo-empresa">
                </div>
                <h3 style="margin-bottom: 20px; color: var(--text);">Iniciar sesión</h3>

                <form id="formLogin">
                    <div class="form-group">
                        <label>Usuario (correo)</label>
                        <input type="email" id="loginUsuario" placeholder="Ingresa tu usuario" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <p id="loginError" class="error-message"></p>
                    <button type="submit" class="btn-primary" id="btnLogin">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="funciones.js"></script>
</body>
</html>
