<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMR Comunicaciones - Reportes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cargando-auth">

    <header class="main-header"></header>

    <div class="window-container">
        <div class="admin-layout">
            <aside class="sidebar">
                <div class="login-logo">
                    <img src="LOGO/logo2.png" alt="DMR Comunicaciones" class="logo-empresa">
                </div>
                <ul class="sidebar-menu">
                    <li><a href="incio.html">Inicio</a></li>
                    <li><a href="listacliente.html">Clientes</a></li>
                    <li><a href="registrocliente.html">+ Nuevo Cliente</a></li>
                    <li><a href="pagos.html">Pagos</a></li>
                    <li class="active"><a href="reportes.html">Reportes</a></li>
                    <li><a href="#">Configuración</a></li>
                </ul>
                <div class="sidebar-footer">Cerrar sesión</div>
            </aside>
            <main class="content-area">
                <div class="content-header">
                    <h1>Reportes</h1>
                </div>

                <div class="metrics-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="metric-card">
                        <div class="metric-info"><h3>Ingresos totales</h3><p id="reporteTotalIngresos">-</p></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-info"><h3>Clientes pendientes</h3><p id="reportePendientes">-</p></div>
                    </div>
                </div>

                <div class="panel-card">
                    <div class="panel-title">Ingresos por mes</div>
                    <table class="custom-table">
                        <thead>
                            <tr><th>Mes</th><th>Ingresos</th></tr>
                        </thead>
                        <tbody id="tablaReportesMeses">
                            <tr><td colspan="2">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="panel-card" style="margin-top:20px;">
                    <div class="panel-title">Exportar todos los clientes</div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-success" id="btnExportarTodosExcel">⬇️ Excel</button>
                        <button class="btn-secondary" id="btnExportarTodosPDF">⬇️ PDF</button>
                    </div>
                </div>

                <div class="panel-card" style="margin-top:20px;">
                    <div class="panel-title">Exportar un cliente en particular</div>
                    <div class="form-group" style="max-width:320px;">
                        <label>Cliente</label>
                        <select id="exportClienteSelect">
                            <option value="">Cargando clientes...</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-success" id="btnExportarClienteExcel">⬇️ Excel</button>
                        <button class="btn-secondary" id="btnExportarClientePDF">⬇️ PDF</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="funciones.js"></script>
</body>
</html>
